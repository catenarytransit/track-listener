[server]
host = "127.0.0.1"
port = 8080
database = "data/track-listener.sqlite3"
web_dist = "web/dist"

[audio]
# Global retained audio payload budget across every channel. Disk WAVs are
# compressed asynchronously to AAC/MP4; RAM audio remains WAV and is lost on restart.
mode = "disk" # "ram" or "disk"
max_mib = 512
path = "data/clips"
max_age_hours = 0 # 0 = no age limit; oldest audio evicted first
transcript_max_age_hours = 0 # 0 = keep transcripts indefinitely, even after audio expires
queue_max_clips = 64
max_clip_seconds = 25

[recognition]
model_dir = "models/sherpa-onnx-nemo-parakeet-tdt-0.6b-v2-int8"
vad_model = "models/silero_vad.onnx"
threads = 4
workers = 1
vad_threshold = 0.35
min_speech_seconds = 0.20
min_silence_seconds = 0.65
hotwords = ["highball", "C.P."]
hotwords_score = 0.75 # set to 0 or use hotwords = [] to restore greedy decoding

[[channels]]
id = "orange"
name = "Orange County"
url = "http://www.railroadradio.net/content/playlist/orange.pls"

[[channels]]
id = "metrolink-sfv"
name = "Metrolink San Fernando Valley"
url = "http://www.railroadradio.net/content/playlist/metrolinkSFV.pls"

[[channels]]
id = "santa-barbara"
name = "Santa Barbara"
url = "http://www.railroadradio.net/content/playlist/SBarbara.pls"

[[channels]]
id = "caltrain"
name = "Caltrain"
url = "http://www.railroadradio.net/content/playlist/caltrain.pls"
