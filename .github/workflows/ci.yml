name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo test --no-default-features
      - run: cargo build --no-default-features
      - name: Demo API smoke test
        run: |
          target/debug/track-listener --demo > demo.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4582/health && break
            sleep 1
          done
          # Verify the main thread and every existing runtime thread inherited nice +19.
          ps -L -p "$PID" -o ni= | awk '$1 != 19 { bad = 1 } END { exit (NR == 0 || bad) }'
          curl -fsS http://127.0.0.1:4582/api/channels | jq -e 'length == 4 and all(.[]; .state == "demo" and .region == "California")'
          curl -fsS http://127.0.0.1:4582/api/status | jq -e '.demo and .archive.clips == 4'
          ID=$(curl -fsS 'http://127.0.0.1:4582/api/clips?channel=caltrain' | jq -er '.items[0].id')
          # The demo WAV is available immediately; wait for the asynchronous MP4.
          for i in $(seq 1 30); do
            if curl -fsSI "http://127.0.0.1:4582/api/clips/$ID/audio" | grep -qi '^content-type: audio/mp4'; then break; fi
            sleep 1
          done
          curl -fsS -D headers -H 'Range: bytes=0-43' "http://127.0.0.1:4582/api/clips/$ID/audio" -o header.mp4
          grep -qi '^HTTP/1.1 206' headers
          grep -qi '^content-type: audio/mp4' headers
          test "$(wc -c < header.mp4)" -eq 44
          test "$(dd if=header.mp4 bs=1 skip=4 count=4 status=none)" = ftyp
          test ! -e "data/demo-clips/$ID.wav"
  rust-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y cmake pkg-config bzip2 libssl-dev ffmpeg
      - run: cargo test --all-features
      - run: cargo build --release
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
